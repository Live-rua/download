name: Build Kylin Samba DFS WebUI Offline Bundle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-samba-offline.yml'
      - 'scripts/**'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-samba-offline.yml'
      - 'scripts/**'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: samba-dfs-webui-offline-${{ github.ref }}
  cancel-in-progress: false

env:
  BUNDLE_NAME: kylin-v10sp3-aarch64-samba-dfs-webui-offline
  RELEASE_TAG: samba-dfs-webui-kylin-v10sp3-aarch64
  SAMBLY_REPO: https://github.com/buadamlaz/Sambly.git
  SAMBLY_COMMIT: 3dab4b2713bc9b4b17f0b903c82600028f44f852
  COCKPIT_FS_TAG: v4.6.1-2
  COCKPIT_FS_RELEASE: '4.6.1-2'

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository inputs
        run: |
          set -euxo pipefail
          test -s scripts/install.sh
          test -s scripts/install-all.sh
          test -s scripts/install-webui.sh
          test -s scripts/configure-dfs-root.sh
          bash -n scripts/install.sh
          bash -n scripts/install-all.sh
          bash -n scripts/install-webui.sh
          bash -n scripts/configure-dfs-root.sh
          grep -Fq 'SAMBLY_PORT' scripts/install-webui.sh
          grep -Fq 'cockpit-file-sharing' scripts/install-webui.sh
          grep -Fq 'msdfs root = yes' scripts/configure-dfs-root.sh

  build:
    name: Full ARM64 offline bundle
    needs: validate
    # PR updates only run the inexpensive static validation job. The full
    # dependency download/build is deliberately reserved for a manual run or
    # a merge/push to main so review iterations do not burn Actions minutes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Prepare bundle directories
        run: |
          set -euxo pipefail
          rm -rf build third_party
          mkdir -p "build/${BUNDLE_NAME}/rpms"
          mkdir -p "build/${BUNDLE_NAME}/webui/sambly"
          mkdir -p "build/${BUNDLE_NAME}/licenses"
          mkdir -p build/addon-repo
          mkdir -p third_party

          cp scripts/install.sh "build/${BUNDLE_NAME}/install.sh"
          cp scripts/install-all.sh "build/${BUNDLE_NAME}/install-all.sh"
          cp scripts/install-webui.sh "build/${BUNDLE_NAME}/install-webui.sh"
          cp scripts/configure-dfs-root.sh "build/${BUNDLE_NAME}/configure-dfs-root.sh"
          chmod +x "build/${BUNDLE_NAME}"/*.sh

      - name: Download cockpit-file-sharing RPM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release download "$COCKPIT_FS_TAG" \
            --repo 45Drives/cockpit-file-sharing \
            --pattern '*el9.noarch.rpm' \
            --dir build/addon-repo
          test -n "$(find build/addon-repo -maxdepth 1 -name 'cockpit-file-sharing-*.el9.noarch.rpm' -print -quit)"
          test "$(find build/addon-repo -maxdepth 1 -name 'cockpit-file-sharing-*.el9.noarch.rpm' | wc -l)" -eq 1
          ls -lh build/addon-repo/cockpit-file-sharing-*.el9.noarch.rpm

      - name: Download Kylin V10 SP3 ARM64 packages and verify offline dependency closure
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/arm64 \
            -e BUNDLE_NAME="$BUNDLE_NAME" \
            -v "$PWD:/work" \
            -w /work \
            rockylinux:8 \
            bash -euxo pipefail -c '
              # Minimal Rocky image does not include find/xargs. Install only
              # the tools actually used below; coreutils-single already provides
              # the required core utilities in this image.
              dnf -y install dnf-plugins-core createrepo_c rpm findutils

              cat > /etc/yum.repos.d/kylin-offline.repo <<"EOF"
          [kylin-v10sp3-base]
          name=Kylin V10 SP3 2403 Base aarch64
          baseurl=https://update.cs2c.com.cn/NS/V10/V10SP3-2403/os/adv/lic/base/aarch64/
          enabled=1
          gpgcheck=0
          repo_gpgcheck=0
          metadata_expire=0

          [kylin-v10sp3-updates]
          name=Kylin V10 SP3 2403 Updates aarch64
          baseurl=https://update.cs2c.com.cn/NS/V10/V10SP3-2403/os/adv/lic/updates/aarch64/
          enabled=1
          gpgcheck=0
          repo_gpgcheck=0
          metadata_expire=0
          EOF

              # Keep the upstream noarch Cockpit add-on in a separate temporary
              # repo so DNF can resolve every dependency from the Kylin repos.
              createrepo_c /work/build/addon-repo
              cat >> /etc/yum.repos.d/kylin-offline.repo <<EOF

          [offline-addons]
          name=Offline third-party addons
          baseurl=file:///work/build/addon-repo
          enabled=1
          gpgcheck=0
          metadata_expire=0
          EOF

              dnf clean all
              dnf makecache \
                --disablerepo="*" \
                --enablerepo=kylin-v10sp3-base,kylin-v10sp3-updates,offline-addons

              dnf \
                --disablerepo="*" \
                --enablerepo=kylin-v10sp3-base,kylin-v10sp3-updates,offline-addons \
                --setopt=install_weak_deps=False \
                download --resolve --alldeps \
                --destdir=/work/build/${BUNDLE_NAME}/rpms \
                samba samba-client samba-common samba-common-tools \
                cockpit cockpit-bridge cockpit-system cockpit-ws \
                cockpit-file-sharing

              test -n "$(find /work/build/${BUNDLE_NAME}/rpms -maxdepth 1 -name "*.rpm" -print -quit)"
              ls /work/build/${BUNDLE_NAME}/rpms/samba-4.11.12-*.ky10.aarch64.rpm
              ls /work/build/${BUNDLE_NAME}/rpms/cockpit-file-sharing-*.noarch.rpm

              rm -rf /work/build/${BUNDLE_NAME}/rpms/repodata
              createrepo_c /work/build/${BUNDLE_NAME}/rpms

              find /work/build/${BUNDLE_NAME}/rpms -maxdepth 1 -name "*.rpm" -print0 \
                | sort -z \
                | xargs -0 -r rpm -qp --qf "%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n" \
                > /work/build/${BUNDLE_NAME}/packages-manifest.txt

              rpm -qpR /work/build/${BUNDLE_NAME}/rpms/cockpit-file-sharing-*.noarch.rpm \
                > /work/build/${BUNDLE_NAME}/cockpit-file-sharing-requires.txt

              # Re-resolve the same top-level packages using ONLY the generated
              # local repository. This is the offline-closure proof: a missing
              # RPM dependency makes this command fail before any artifact ships.
              cat > /etc/yum.repos.d/offline-verify.repo <<EOF
          [offline-verify]
          name=Generated Offline Repository Verification
          baseurl=file:///work/build/${BUNDLE_NAME}/rpms
          enabled=1
          gpgcheck=0
          metadata_expire=0
          EOF
              rm -rf /tmp/offline-verify
              mkdir -p /tmp/offline-verify
              dnf clean all
              dnf makecache --disablerepo="*" --enablerepo=offline-verify
              dnf \
                --disablerepo="*" \
                --enablerepo=offline-verify \
                --setopt=install_weak_deps=False \
                download --resolve --alldeps \
                --destdir=/tmp/offline-verify \
                samba samba-client samba-common samba-common-tools \
                cockpit cockpit-bridge cockpit-system cockpit-ws \
                cockpit-file-sharing

              rm -rf /work/build/addon-repo
            '

      - name: Validate RPM manifest
        run: |
          set -euxo pipefail
          manifest="build/${BUNDLE_NAME}/packages-manifest.txt"
          rpm_dir="build/${BUNDLE_NAME}/rpms"

          test "$(wc -l < "$manifest")" -eq "$(find "$rpm_dir" -maxdepth 1 -type f -name '*.rpm' | wc -l)"
          grep -Eq '^samba 4\.11\.12-.* aarch64$' "$manifest"
          grep -Eq '^cockpit-file-sharing 4\.6\.1-2\.el9 noarch$' "$manifest"

          bad_arch="$(awk '$3 != "aarch64" && $3 != "noarch" {print}' "$manifest")"
          if [[ -n "$bad_arch" ]]; then
            echo "Unexpected RPM architecture(s):" >&2
            echo "$bad_arch" >&2
            exit 1
          fi

          for pkg in attr cockpit-bridge coreutils curl findutils glibc-common hostname iproute nfs-utils python3-botocore samba-common-tools systemd; do
            grep -q "^${pkg} " "$manifest"
          done

      - name: Set up Go for Sambly ARM64 build
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false

      - name: Test and build Sambly single binary for ARM64
        run: |
          set -euxo pipefail
          git clone "$SAMBLY_REPO" third_party/Sambly
          git -C third_party/Sambly checkout --detach "$SAMBLY_COMMIT"

          (
            cd third_party/Sambly
            test "$(git rev-parse HEAD)" = "$SAMBLY_COMMIT"
            go test ./...
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
              go build -trimpath -ldflags='-s -w' \
              -o "../../build/${BUNDLE_NAME}/webui/sambly/sambly" \
              ./cmd/server
          )

          chmod +x "build/${BUNDLE_NAME}/webui/sambly/sambly"
          file "build/${BUNDLE_NAME}/webui/sambly/sambly"
          readelf -h "build/${BUNDLE_NAME}/webui/sambly/sambly" | grep -E 'Class:|Machine:'
          readelf -h "build/${BUNDLE_NAME}/webui/sambly/sambly" | grep -q 'AArch64'
          if readelf -d "build/${BUNDLE_NAME}/webui/sambly/sambly" 2>/dev/null | grep -q '(NEEDED)'; then
            echo 'Sambly binary unexpectedly has dynamic library dependencies.' >&2
            exit 1
          fi

          cp third_party/Sambly/LICENSE "build/${BUNDLE_NAME}/licenses/Sambly-LICENSE"
          printf '%s\n' \
            "Sambly source: https://github.com/buadamlaz/Sambly" \
            "Pinned commit: ${SAMBLY_COMMIT}" \
            "Build: CGO_ENABLED=0 GOOS=linux GOARCH=arm64" \
            > "build/${BUNDLE_NAME}/webui/sambly/SOURCE.txt"

      - name: Create bundle, checksums, and documentation
        run: |
          set -euxo pipefail
          cat > "build/${BUNDLE_NAME}/README.txt" <<EOF
          Kylin V10 SP3 ARM64 Samba DFS + WebUI Offline Bundle
          ====================================================

          Target platform:
            Kylin Linux Advanced Server V10 SP3-2403
            aarch64 / ARM64

          Included:
            1. Official Kylin Samba 4.11.12 packages + complete dependency closure
            2. Official Kylin Cockpit runtime packages + dependency closure
            3. 45Drives cockpit-file-sharing ${COCKPIT_FS_RELEASE} noarch RPM
            4. Sambly ARM64 static single binary built from pinned commit ${SAMBLY_COMMIT}
            5. Offline installers and Samba DFS Root helper

          Recommended install:
            sudo bash install-all.sh

          Samba only:
            sudo bash install.sh

          WebUI only after Samba is installed:
            sudo bash install-webui.sh all
            sudo bash install-webui.sh sambly
            sudo bash install-webui.sh cockpit

          Optional DFS Root initialization:
            sudo bash configure-dfs-root.sh

          Web interfaces:
            Sambly  : http://<server-ip>:8090
            Cockpit : https://<server-ip>:9090

          Management model:
            - Sambly edits /etc/samba/smb.conf directly and can create Linux/Samba users and groups.
            - cockpit-file-sharing manages Samba shares through Samba registry/net conf.
            - Do not use both UIs to edit the same share definitions at the same time.
            - For an existing smb.conf/DFS Root, prefer Sambly unless you intentionally migrate
              the Samba share configuration to registry management.

          Important:
            - install scripts do not automatically replace smb.conf.
            - existing smb.conf shares are NOT automatically imported into Cockpit.
            - do not use Cockpit Import on a DFS Root until smb.conf is backed up and the
              registry/include model has been reviewed.
            - Sambly runs as root; expose port 8090 only to trusted management networks.
            - The scripts do not automatically open firewall ports 8090 or 9090.

          RPM sources:
            Kylin official V10 SP3-2403 Base/Updates repositories.
            cockpit-file-sharing upstream release ${COCKPIT_FS_TAG}.
          EOF

          (
            cd "build/${BUNDLE_NAME}"
            find rpms -type f -name '*.rpm' -print0 | sort -z | xargs -0 sha256sum
            sha256sum \
              install.sh install-all.sh install-webui.sh configure-dfs-root.sh \
              packages-manifest.txt cockpit-file-sharing-requires.txt README.txt \
              webui/sambly/sambly webui/sambly/SOURCE.txt licenses/Sambly-LICENSE
          ) > "build/${BUNDLE_NAME}/SHA256SUMS"

          tar -C build -czf "build/${BUNDLE_NAME}.tar.gz" "${BUNDLE_NAME}"
          # Write only the basename so `sha256sum -c` works after users download
          # the two release files into any directory.
          (
            cd build
            sha256sum "${BUNDLE_NAME}.tar.gz" > "${BUNDLE_NAME}.tar.gz.sha256"
          )

      - name: Audit final artifact locally
        run: |
          set -euxo pipefail
          cd build
          sha256sum -c "${BUNDLE_NAME}.tar.gz.sha256"

          audit_dir="$(mktemp -d)"
          trap 'rm -rf "$audit_dir"' EXIT
          tar -xzf "${BUNDLE_NAME}.tar.gz" -C "$audit_dir"
          bundle="$audit_dir/${BUNDLE_NAME}"

          (
            cd "$bundle"
            sha256sum -c SHA256SUMS
            bash -n install.sh
            bash -n install-all.sh
            bash -n install-webui.sh
            bash -n configure-dfs-root.sh
            test -x webui/sambly/sambly
          )

          test "$(wc -l < "$bundle/packages-manifest.txt")" -eq \
               "$(find "$bundle/rpms" -maxdepth 1 -type f -name '*.rpm' | wc -l)"

          echo '--- Key packages ---'
          grep -E '^(samba|cockpit)' "$bundle/packages-manifest.txt" || true
          echo '--- Sambly binary ---'
          file "$bundle/webui/sambly/sambly"
          echo '--- Bundle size ---'
          du -sh "$bundle" "${BUNDLE_NAME}.tar.gz"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE_NAME }}
          path: |
            build/${{ env.BUNDLE_NAME }}.tar.gz
            build/${{ env.BUNDLE_NAME }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "build/${BUNDLE_NAME}.tar.gz" \
              "build/${BUNDLE_NAME}.tar.gz.sha256" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "build/${BUNDLE_NAME}.tar.gz" \
              "build/${BUNDLE_NAME}.tar.gz.sha256" \
              --title "Kylin V10 SP3 ARM64 Samba DFS + Sambly + Cockpit Offline Bundle" \
              --notes "Offline bundle for Kylin V10 SP3 aarch64: official Kylin Samba/Cockpit RPM dependency closure, Sambly ARM64 static single binary, 45Drives cockpit-file-sharing, offline installers, DFS helper, manifest and SHA256 checksums."
          fi

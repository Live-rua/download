name: Build Kylin Samba + Sambly Full Offline Bundle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-samba-offline.yml'
      - 'scripts/**'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-samba-offline.yml'
      - 'scripts/**'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: samba-sambly-full-${{ github.ref }}
  cancel-in-progress: false

env:
  BUNDLE_NAME: kylin-v10sp3-aarch64-samba-sambly-full
  RELEASE_TAG: samba-sambly-kylin-v10sp3-aarch64-full
  SAMBA_NEVR: 4.11.12-32.p11.ky10
  SAMBLY_REPO: https://github.com/buadamlaz/Sambly.git
  SAMBLY_COMMIT: 3dab4b2713bc9b4b17f0b903c82600028f44f852

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts and DFS settings
        run: |
          set -euxo pipefail
          for f in scripts/install.sh scripts/configure-dfs-root.sh scripts/add-dfs-target.sh; do
            test -s "$f"
            bash -n "$f"
          done
          grep -Fq 'samba-offline-local' scripts/install.sh
          grep -Fq 'tsflags=test' scripts/install.sh
          grep -Fq -- "--disablerepo='*'" scripts/install.sh
          grep -Fq 'msdfs root = yes' scripts/configure-dfs-root.sh
          grep -Fq 'msdfs:' scripts/add-dfs-target.sh

  build:
    name: Build verified full ARM64 bundle
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Prepare bundle
        run: |
          set -euxo pipefail
          rm -rf build third_party
          mkdir -p "build/${BUNDLE_NAME}/rpms" "build/${BUNDLE_NAME}/webui/sambly" "build/${BUNDLE_NAME}/licenses" third_party
          cp scripts/install.sh scripts/configure-dfs-root.sh scripts/add-dfs-target.sh "build/${BUNDLE_NAME}/"
          chmod +x "build/${BUNDLE_NAME}"/*.sh

      - name: Resolve, download and prove complete Kylin RPM closure
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/arm64 \
            -e BUNDLE_NAME="$BUNDLE_NAME" \
            -e SAMBA_NEVR="$SAMBA_NEVR" \
            -v "$PWD:/work" -w /work rockylinux:8 \
            bash -euxo pipefail -c '
              dnf -y install dnf-plugins-core createrepo_c rpm findutils

              cat >/etc/yum.repos.d/kylin-offline.repo <<"EOF"
          [kylin-v10sp3-base]
          name=Kylin V10 SP3 2403 Base aarch64
          baseurl=https://update.cs2c.com.cn/NS/V10/V10SP3-2403/os/adv/lic/base/aarch64/
          enabled=1
          gpgcheck=0
          repo_gpgcheck=0
          metadata_expire=0

          [kylin-v10sp3-updates]
          name=Kylin V10 SP3 2403 Updates aarch64
          baseurl=https://update.cs2c.com.cn/NS/V10/V10SP3-2403/os/adv/lic/updates/aarch64/
          enabled=1
          gpgcheck=0
          repo_gpgcheck=0
          metadata_expire=0
          EOF

              repos="kylin-v10sp3-base,kylin-v10sp3-updates"
              roots=(
                "samba-${SAMBA_NEVR}.aarch64"
                "samba-client-${SAMBA_NEVR}.aarch64"
                "samba-common-${SAMBA_NEVR}.aarch64"
                "samba-common-tools-${SAMBA_NEVR}.aarch64"
              )

              dnf clean all
              dnf makecache --disablerepo="*" --enablerepo="$repos"

              # Download every recursively required strong dependency even when the
              # ARM64 build container already has a compatible provider installed.
              dnf --disablerepo="*" --enablerepo="$repos" \
                --setopt=install_weak_deps=False \
                download --resolve --alldeps \
                --destdir="/work/build/${BUNDLE_NAME}/rpms" \
                "${roots[@]}"

              for root in "${roots[@]}"; do
                test -f "/work/build/${BUNDLE_NAME}/rpms/${root}.rpm"
              done

              rpm_count="$(find "/work/build/${BUNDLE_NAME}/rpms" -maxdepth 1 -type f -name "*.rpm" | wc -l)"
              test "$rpm_count" -gt 7

              while IFS= read -r -d "" f; do
                arch="$(rpm -qp --qf "%{ARCH}" "$f")"
                case "$arch" in aarch64|noarch) ;; *) echo "bad arch: $arch $f" >&2; exit 1;; esac
              done < <(find "/work/build/${BUNDLE_NAME}/rpms" -maxdepth 1 -type f -name "*.rpm" -print0)

              createrepo_c "/work/build/${BUNDLE_NAME}/rpms"

              find "/work/build/${BUNDLE_NAME}/rpms" -maxdepth 1 -type f -name "*.rpm" -print0 | sort -z \
                | xargs -0 -r rpm -qp --qf "%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n" \
                > "/work/build/${BUNDLE_NAME}/packages-manifest.txt"
              find "/work/build/${BUNDLE_NAME}/rpms" -maxdepth 1 -type f -name "*.rpm" -print0 | sort -z \
                | xargs -0 -r rpm -qpR > "/work/build/${BUNDLE_NAME}/rpm-requires.txt"
              printf "%s\n" "${roots[@]}" > "/work/build/${BUNDLE_NAME}/root-packages.txt"

              cat > "/work/build/${BUNDLE_NAME}/kylin-repositories.txt" <<"EOF"
          https://update.cs2c.com.cn/NS/V10/V10SP3-2403/os/adv/lic/base/aarch64/
          https://update.cs2c.com.cn/NS/V10/V10SP3-2403/os/adv/lic/updates/aarch64/
          EOF

              # Strong proof: install the pinned Samba roots into an empty filesystem
              # using ONLY the generated local repository. Missing dependencies fail here.
              rm -rf /tmp/kylin-offline-root
              mkdir -p /tmp/kylin-offline-root
              dnf -y --installroot=/tmp/kylin-offline-root --releasever=10 \
                --disablerepo="*" \
                --repofrompath=samba-offline,file:///work/build/${BUNDLE_NAME}/rpms \
                --enablerepo=samba-offline --nogpgcheck \
                --setopt=install_weak_deps=False \
                --setopt=module_platform_id=platform:el8 \
                install "${roots[@]}"

              rpm --root /tmp/kylin-offline-root -q samba samba-client samba-common samba-common-tools
              rpm --root /tmp/kylin-offline-root -qa --qf "%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n" | sort \
                > "/work/build/${BUNDLE_NAME}/offline-installroot-packages.txt"
              grep -Eq "^samba 4\\.11\\.12-32\\.p11\\.ky10 aarch64$" \
                "/work/build/${BUNDLE_NAME}/offline-installroot-packages.txt"
            '

      - name: Validate RPM evidence
        run: |
          set -euxo pipefail
          bundle="build/${BUNDLE_NAME}"
          count="$(find "$bundle/rpms" -maxdepth 1 -type f -name '*.rpm' | wc -l)"
          test "$count" -gt 7
          test -f "$bundle/rpms/repodata/repomd.xml"
          test -s "$bundle/offline-installroot-packages.txt"
          for pkg in samba samba-client samba-common samba-common-tools; do
            grep -Eq "^${pkg} 4\\.11\\.12-32\\.p11\\.ky10 aarch64$" "$bundle/packages-manifest.txt"
          done
          if grep -Eq ' (x86_64|i[3-6]86)$' "$bundle/packages-manifest.txt"; then
            echo 'non-ARM RPM detected' >&2
            exit 1
          fi
          echo "Resolved RPM count: $count"
          du -sh "$bundle/rpms"

      - name: Build and test Sambly ARM64 static binary
        run: |
          set -euxo pipefail
          git clone "$SAMBLY_REPO" third_party/Sambly
          git -C third_party/Sambly checkout --detach "$SAMBLY_COMMIT"
          (
            cd third_party/Sambly
            test "$(git rev-parse HEAD)" = "$SAMBLY_COMMIT"
            go test ./...
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' \
              -o "../../build/${BUNDLE_NAME}/webui/sambly/sambly" ./cmd/server
          )
          chmod +x "build/${BUNDLE_NAME}/webui/sambly/sambly"
          file "build/${BUNDLE_NAME}/webui/sambly/sambly"
          readelf -h "build/${BUNDLE_NAME}/webui/sambly/sambly" | grep -q 'AArch64'
          if readelf -d "build/${BUNDLE_NAME}/webui/sambly/sambly" 2>/dev/null | grep -q '(NEEDED)'; then
            echo 'Sambly unexpectedly has dynamic library dependencies' >&2
            exit 1
          fi
          cp third_party/Sambly/LICENSE "build/${BUNDLE_NAME}/licenses/Sambly-LICENSE"
          printf '%s\n' "source=$SAMBLY_REPO" "commit=$SAMBLY_COMMIT" \
            > "build/${BUNDLE_NAME}/webui/sambly/SOURCE.txt"

      - name: Package and audit
        run: |
          set -euxo pipefail
          bundle="build/${BUNDLE_NAME}"
          count="$(find "$bundle/rpms" -maxdepth 1 -type f -name '*.rpm' | wc -l)"
          cat > "$bundle/README.txt" <<EOF
          Kylin V10 SP3 ARM64 Samba 4.11 + Sambly Full Offline Bundle
          Target: Kylin Linux Advanced Server V10 SP3-2403 aarch64
          Samba: 4.11.12-32.p11.ky10
          Resolved RPM count: ${count}

          The RPM set is the recursively resolved strong dependency closure from
          Kylin official Base/Updates repositories. The workflow verified it by
          installing Samba into an empty installroot using only rpms/ as file:// repo.

          Install: sudo bash install.sh
          DFS root: sudo bash configure-dfs-root.sh
          Add target: sudo bash add-dfs-target.sh kylin01 192.168.88.211 ledong_share
          Windows: \\\\<DFS-IP>\\files
          EOF

          (cd "$bundle" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          tar -C build -czf "build/${BUNDLE_NAME}.tar.gz" "$BUNDLE_NAME"
          (cd build && sha256sum "${BUNDLE_NAME}.tar.gz" > "${BUNDLE_NAME}.tar.gz.sha256")

          cd build
          sha256sum -c "${BUNDLE_NAME}.tar.gz.sha256"
          audit="$(mktemp -d)"
          trap 'rm -rf "$audit"' EXIT
          tar -xzf "${BUNDLE_NAME}.tar.gz" -C "$audit"
          cd "$audit/${BUNDLE_NAME}"
          sha256sum -c SHA256SUMS
          bash -n install.sh
          bash -n configure-dfs-root.sh
          bash -n add-dfs-target.sh
          test -f rpms/repodata/repomd.xml
          test "$(find rpms -maxdepth 1 -type f -name '*.rpm' | wc -l)" -gt 7
          readelf -h webui/sambly/sambly | grep -q 'AArch64'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE_NAME }}
          path: |
            build/${{ env.BUNDLE_NAME }}.tar.gz
            build/${{ env.BUNDLE_NAME }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          notes='Verified full offline bundle for Kylin V10 SP3-2403 aarch64: Samba 4.11.12-32.p11 plus recursively resolved strong dependencies from Kylin official repositories, empty-installroot offline proof, Sambly ARM64 static binary, DFS helpers and SHA256 checksums.'
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "build/${BUNDLE_NAME}.tar.gz" "build/${BUNDLE_NAME}.tar.gz.sha256" --clobber
            gh release edit "$RELEASE_TAG" --title 'Kylin V10 SP3 ARM64 Samba 4.11 + Sambly Full Offline Bundle' --notes "$notes"
          else
            gh release create "$RELEASE_TAG" "build/${BUNDLE_NAME}.tar.gz" "build/${BUNDLE_NAME}.tar.gz.sha256" \
              --title 'Kylin V10 SP3 ARM64 Samba 4.11 + Sambly Full Offline Bundle' --notes "$notes"
          fi

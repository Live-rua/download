name: Build Kylin Samba + Sambly Full Offline Bundle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-samba-offline.yml'
      - 'scripts/**'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-samba-offline.yml'
      - 'scripts/**'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: samba-sambly-full-${{ github.ref }}
  cancel-in-progress: false

env:
  BUNDLE_NAME: kylin-v10sp3-aarch64-samba-sambly-full
  RELEASE_TAG: samba-sambly-kylin-v10sp3-aarch64-full
  SAMBA_NEVR: 4.11.12-32.p11.ky10
  SAMBLY_REPO: https://github.com/buadamlaz/Sambly.git
  SAMBLY_COMMIT: 3dab4b2713bc9b4b17f0b903c82600028f44f852

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository inputs
        run: |
          set -euxo pipefail
          for f in scripts/install.sh scripts/configure-dfs-root.sh scripts/add-dfs-target.sh; do
            test -s "$f"
            bash -n "$f"
          done
          grep -Fq 'samba-offline-local' scripts/install.sh
          grep -Fq 'tsflags=test' scripts/install.sh
          grep -Fq "--disablerepo='*'" scripts/install.sh
          grep -Fq 'msdfs root = yes' scripts/configure-dfs-root.sh
          grep -Fq 'msdfs:' scripts/add-dfs-target.sh

  build:
    name: Full ARM64 offline bundle
    needs: validate
    # PRs only run static validation. Full download/build happens on main or manual dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Prepare bundle directories
        run: |
          set -euxo pipefail
          rm -rf build third_party
          mkdir -p "build/${BUNDLE_NAME}/rpms"
          mkdir -p "build/${BUNDLE_NAME}/webui/sambly"
          mkdir -p "build/${BUNDLE_NAME}/licenses"
          mkdir -p third_party

          cp scripts/install.sh "build/${BUNDLE_NAME}/install.sh"
          cp scripts/configure-dfs-root.sh "build/${BUNDLE_NAME}/configure-dfs-root.sh"
          cp scripts/add-dfs-target.sh "build/${BUNDLE_NAME}/add-dfs-target.sh"
          chmod +x "build/${BUNDLE_NAME}"/*.sh

      - name: Download complete official Kylin Samba dependency closure
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/arm64 \
            -e BUNDLE_NAME="$BUNDLE_NAME" \
            -e SAMBA_NEVR="$SAMBA_NEVR" \
            -v "$PWD:/work" \
            -w /work \
            rockylinux:8 \
            bash -euxo pipefail -c '
              dnf -y install dnf-plugins-core createrepo_c rpm findutils

              cat > /etc/yum.repos.d/kylin-offline.repo <<"EOF"
          [kylin-v10sp3-base]
          name=Kylin V10 SP3 2403 Base aarch64
          baseurl=https://update.cs2c.com.cn/NS/V10/V10SP3-2403/os/adv/lic/base/aarch64/
          enabled=1
          gpgcheck=0
          repo_gpgcheck=0
          metadata_expire=0

          [kylin-v10sp3-updates]
          name=Kylin V10 SP3 2403 Updates aarch64
          baseurl=https://update.cs2c.com.cn/NS/V10/V10SP3-2403/os/adv/lic/updates/aarch64/
          enabled=1
          gpgcheck=0
          repo_gpgcheck=0
          metadata_expire=0
          EOF

              dnf clean all
              dnf makecache \
                --disablerepo="*" \
                --enablerepo=kylin-v10sp3-base,kylin-v10sp3-updates

              roots=(
                "samba-${SAMBA_NEVR}.aarch64"
                "samba-client-${SAMBA_NEVR}.aarch64"
                "samba-common-${SAMBA_NEVR}.aarch64"
                "samba-common-tools-${SAMBA_NEVR}.aarch64"
              )

              # --resolve recursively pulls strong dependencies.
              # --alldeps forces dependencies to be downloaded even if the ARM64
              # builder image already has a compatible package installed.
              dnf \
                --disablerepo="*" \
                --enablerepo=kylin-v10sp3-base,kylin-v10sp3-updates \
                --setopt=install_weak_deps=False \
                download --resolve --alldeps \
                --destdir="/work/build/${BUNDLE_NAME}/rpms" \
                "${roots[@]}"

              for pkg in "${roots[@]}"; do
                test -f "/work/build/${BUNDLE_NAME}/rpms/${pkg}.rpm"
              done

              count="$(find "/work/build/${BUNDLE_NAME}/rpms" -maxdepth 1 -type f -name "*.rpm" | wc -l)"
              test "$count" -gt 7

              # The target is ARM64. noarch dependencies are valid; x86 packages are not.
              while IFS= read -r -d "" rpm_file; do
                arch="$(rpm -qp --qf "%{ARCH}" "$rpm_file")"
                case "$arch" in
                  aarch64|noarch) ;;
                  *) echo "Unexpected RPM architecture: $arch $rpm_file" >&2; exit 1 ;;
                esac
              done < <(find "/work/build/${BUNDLE_NAME}/rpms" -maxdepth 1 -type f -name "*.rpm" -print0)

              createrepo_c "/work/build/${BUNDLE_NAME}/rpms"

              find "/work/build/${BUNDLE_NAME}/rpms" -maxdepth 1 -type f -name "*.rpm" -print0 \
                | sort -z \
                | xargs -0 -r rpm -qp --qf "%{NAME} %{EPOCHNUM}:%{VERSION}-%{RELEASE} %{ARCH}\n" \
                > "/work/build/${BUNDLE_NAME}/packages-manifest.txt"

              find "/work/build/${BUNDLE_NAME}/rpms" -maxdepth 1 -type f -name "*.rpm" -print0 \
                | sort -z \
                | xargs -0 -r rpm -qpR \
                > "/work/build/${BUNDLE_NAME}/rpm-requires.txt"

              printf "%s\n" "${roots[@]}" > "/work/build/${BUNDLE_NAME}/root-packages.txt"
              cat > "/work/build/${BUNDLE_NAME}/kylin-repositories.txt" <<"EOF"
          Kylin V10 SP3-2403 ARM64 official repositories used by the build:
          https://update.cs2c.com.cn/NS/V10/V10SP3-2403/os/adv/lic/base/aarch64/
          https://update.cs2c.com.cn/NS/V10/V10SP3-2403/os/adv/lic/updates/aarch64/
          EOF
            '

      - name: Prove dependency closure with an empty offline installroot
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/arm64 \
            -e BUNDLE_NAME="$BUNDLE_NAME" \
            -e SAMBA_NEVR="$SAMBA_NEVR" \
            -v "$PWD:/work" \
            -w /work \
            rockylinux:8 \
            bash -euxo pipefail -c '
              dnf -y install dnf-plugins-core rpm
              rm -rf /tmp/kylin-offline-root
              mkdir -p /tmp/kylin-offline-root

              roots=(
                "samba-${SAMBA_NEVR}.aarch64"
                "samba-client-${SAMBA_NEVR}.aarch64"
                "samba-common-${SAMBA_NEVR}.aarch64"
                "samba-common-tools-${SAMBA_NEVR}.aarch64"
              )

              # Only the generated file:// repository is enabled here. If any strong
              # dependency is absent from the bundle, this transaction must fail.
              dnf -y \
                --installroot=/tmp/kylin-offline-root \
                --releasever=10 \
                --disablerepo="*" \
                --repofrompath=samba-offline,file:///work/build/${BUNDLE_NAME}/rpms \
                --enablerepo=samba-offline \
                --nogpgcheck \
                --setopt=install_weak_deps=False \
                --setopt=module_platform_id=platform:el8 \
                install "${roots[@]}"

              rpm --root /tmp/kylin-offline-root -q samba samba-client samba-common samba-common-tools
              rpm --root /tmp/kylin-offline-root -qa --qf "%{NAME} %{EPOCHNUM}:%{VERSION}-%{RELEASE} %{ARCH}\n" \
                | sort > "/work/build/${BUNDLE_NAME}/offline-installroot-packages.txt"

              grep -Eq "^samba 0:4\\.11\\.12-32\\.p11\\.ky10 aarch64$" \
                "/work/build/${BUNDLE_NAME}/offline-installroot-packages.txt"
            '

      - name: Validate full RPM set
        run: |
          set -euxo pipefail
          bundle="build/${BUNDLE_NAME}"
          manifest="$bundle/packages-manifest.txt"
          count="$(find "$bundle/rpms" -maxdepth 1 -type f -name '*.rpm' | wc -l)"
          test "$count" -gt 7
          test -f "$bundle/rpms/repodata/repomd.xml"

          for pkg in samba samba-client samba-common samba-common-tools; do
            grep -Eq "^${pkg} 0:4\\.11\\.12-32\\.p11\\.ky10 aarch64$" "$manifest"
          done

          if grep -Eq ' (x86_64|i[3-6]86)$' "$manifest"; then
            echo "Unexpected non-ARM RPM found" >&2
            grep -E ' (x86_64|i[3-6]86)$' "$manifest" >&2
            exit 1
          fi

          echo "Resolved RPM count: $count"
          du -sh "$bundle/rpms"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false

      - name: Test and build Sambly static ARM64 binary
        run: |
          set -euxo pipefail
          git clone "$SAMBLY_REPO" third_party/Sambly
          git -C third_party/Sambly checkout --detach "$SAMBLY_COMMIT"

          (
            cd third_party/Sambly
            test "$(git rev-parse HEAD)" = "$SAMBLY_COMMIT"
            go test ./...
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
              go build -trimpath -ldflags='-s -w' \
              -o "../../build/${BUNDLE_NAME}/webui/sambly/sambly" \
              ./cmd/server
          )

          chmod +x "build/${BUNDLE_NAME}/webui/sambly/sambly"
          file "build/${BUNDLE_NAME}/webui/sambly/sambly"
          readelf -h "build/${BUNDLE_NAME}/webui/sambly/sambly" | grep -q 'AArch64'
          if readelf -d "build/${BUNDLE_NAME}/webui/sambly/sambly" 2>/dev/null | grep -q '(NEEDED)'; then
            echo 'Sambly binary unexpectedly has dynamic library dependencies.' >&2
            exit 1
          fi

          cp third_party/Sambly/LICENSE "build/${BUNDLE_NAME}/licenses/Sambly-LICENSE"
          printf '%s\n' \
            "Sambly source: https://github.com/buadamlaz/Sambly" \
            "Pinned commit: ${SAMBLY_COMMIT}" \
            "Build: CGO_ENABLED=0 GOOS=linux GOARCH=arm64" \
            > "build/${BUNDLE_NAME}/webui/sambly/SOURCE.txt"

      - name: Create full offline bundle
        run: |
          set -euxo pipefail
          count="$(find "build/${BUNDLE_NAME}/rpms" -maxdepth 1 -type f -name '*.rpm' | wc -l)"
          cat > "build/${BUNDLE_NAME}/README.txt" <<EOF
          Kylin V10 SP3 ARM64 Samba 4.11 + Sambly Full Offline Bundle
          ===========================================================

          Target:
            Kylin Linux Advanced Server V10 SP3-2403 aarch64
            Samba 4.11.12-32.p11.ky10

          RPM count resolved by this build: ${count}

          This is the full strong dependency closure for the pinned Samba root
          packages. The build validates the closure by installing Samba into an
          empty installroot while enabling only this bundle's local file:// repo.

          The package does not require Internet access during installation.

          Install:
            sudo bash install.sh

          Configure this server as DFS Root:
            sudo bash configure-dfs-root.sh

          Add a backend:
            sudo bash add-dfs-target.sh kylin01 192.168.88.211 ledong_share

          Sambly:
            http://<server-ip>:8090

          Windows DFS entry:
            \\\\<server-ip>\\files

          Evidence files:
            packages-manifest.txt
            root-packages.txt
            rpm-requires.txt
            offline-installroot-packages.txt
            kylin-repositories.txt
            rpms/repodata/
            SHA256SUMS
          EOF

          (
            cd "build/${BUNDLE_NAME}"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

          tar -C build -czf "build/${BUNDLE_NAME}.tar.gz" "${BUNDLE_NAME}"
          (
            cd build
            sha256sum "${BUNDLE_NAME}.tar.gz" > "${BUNDLE_NAME}.tar.gz.sha256"
          )

      - name: Audit final artifact
        run: |
          set -euxo pipefail
          cd build
          sha256sum -c "${BUNDLE_NAME}.tar.gz.sha256"

          audit_dir="$(mktemp -d)"
          trap 'rm -rf "$audit_dir"' EXIT
          tar -xzf "${BUNDLE_NAME}.tar.gz" -C "$audit_dir"
          bundle="$audit_dir/${BUNDLE_NAME}"

          (
            cd "$bundle"
            sha256sum -c SHA256SUMS
            bash -n install.sh
            bash -n configure-dfs-root.sh
            bash -n add-dfs-target.sh
            test -x webui/sambly/sambly
            test -f rpms/repodata/repomd.xml
            test "$(find rpms -maxdepth 1 -type f -name '*.rpm' | wc -l)" -gt 7
            test -s offline-installroot-packages.txt
          )

          readelf -h "$bundle/webui/sambly/sambly" | grep -q 'AArch64'
          du -sh "$bundle" "${BUNDLE_NAME}.tar.gz"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE_NAME }}
          path: |
            build/${{ env.BUNDLE_NAME }}.tar.gz
            build/${{ env.BUNDLE_NAME }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          notes="Full offline bundle for Kylin V10 SP3-2403 aarch64. Samba 4.11.12-32.p11 plus its recursively resolved strong dependency closure are downloaded only from Kylin official Base/Updates repositories. The workflow proves closure completeness with an empty offline installroot, builds Sambly as a static ARM64 binary, validates checksums and publishes the verified archive."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "build/${BUNDLE_NAME}.tar.gz" \
              "build/${BUNDLE_NAME}.tar.gz.sha256" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Kylin V10 SP3 ARM64 Samba 4.11 + Sambly Full Offline Bundle" \
              --notes "$notes"
          else
            gh release create "$RELEASE_TAG" \
              "build/${BUNDLE_NAME}.tar.gz" \
              "build/${BUNDLE_NAME}.tar.gz.sha256" \
              --title "Kylin V10 SP3 ARM64 Samba 4.11 + Sambly Full Offline Bundle" \
              --notes "$notes"
          fi

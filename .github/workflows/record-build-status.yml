name: Record full bundle build status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-samba-offline.yml'
      - 'scripts/**'
      - 'README.md'

permissions:
  actions: read
  contents: write

env:
  RELEASE_TAG: samba-sambly-kylin-v10sp3-aarch64-full
  BUNDLE_NAME: kylin-v10sp3-aarch64-samba-sambly-full

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Locate and record bundle workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          run_json=''
          for _ in $(seq 1 20); do
            run_json="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow build-samba-offline.yml \
              --commit "$GITHUB_SHA" \
              --event push \
              --limit 5 \
              --json databaseId,number,status,conclusion,url,headSha \
              --jq '.[0] // empty')"
            [[ -n "$run_json" ]] && break
            sleep 3
          done

          if [[ -z "$run_json" ]]; then
            echo '未找到对应的主构建 workflow run。' >&2
            exit 1
          fi

          run_id="$(jq -r '.databaseId' <<<"$run_json")"
          run_number="$(jq -r '.number' <<<"$run_json")"
          status="$(jq -r '.status' <<<"$run_json")"
          conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
          head_sha="$(jq -r '.headSha' <<<"$run_json")"
          run_url="$(jq -r '.url' <<<"$run_json")"

          mkdir -p .build-status
          cat > .build-status/latest.txt <<EOF
          workflow=Build Kylin Samba + Sambly Full Offline Bundle
          run_id=${run_id}
          run_number=${run_number}
          status=${status}
          conclusion=${conclusion}
          head_sha=${head_sha}
          run_url=${run_url}
          release_tag=${RELEASE_TAG}
          bundle=${BUNDLE_NAME}.tar.gz
          checksum=${BUNDLE_NAME}.tar.gz.sha256
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .build-status/latest.txt
          git commit -m 'chore: record full bundle build run [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
